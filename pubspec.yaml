name: book_tracker
description: "Una aplicación moderna para seguimiento de lectura."
publish_to: 'none'

version: 1.1.0+10

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  
  # Gestión de Estado
  flutter_riverpod: ^2.6.1
  
  # Base de Datos (Drift/SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Hardware y Sensores
  speech_to_text: ^7.0.0      # Reconocimiento de voz para notas y citas
  image_picker: ^1.1.2        # Para elegir fotos de la galería
  wakelock_plus: ^1.4.0       # Para mantener la pantalla encendida 
  
  # Utilidades y UI
  shared_preferences: ^2.5.4  # Para persistencia del Timer
  intl: ^0.20.2               # Para fechas e idiomas
  http: ^1.3.0                # Para descargar portadas si es necesario
  confetti: ^0.8.0            # Para animaciones de celebración 
  palette_generator: ^0.3.3+7 # Para extraer colores de las portadas
  google_fonts: ^6.2.1        # Para usar fuentes modernas y personalizadas

  # Notificaciones
  flutter_local_notifications: ^17.0.0  # Para notificaciones de lectura
  timezone: ^0.9.2                      # Para manejar zonas horarias
  
  # Guías Interactivas
  tutorial_coach_mark: ^1.3.3           # Para guías interactivas

  # Monetización
  google_mobile_ads: ^6.0.0             # Para monetización
  
  # Compartir
  share_plus: ^10.1.0                   # Para compartir citas y estadísticas

  # Imagen de la Cita
  screenshot: ^3.0.0                    # Para capturar la pantalla y compartir citas como imágenes

  # Autenticación 
  local_auth: ^2.1.6                    # Para autenticación

  # Almacenamiento seguro
  flutter_secure_storage: ^9.0.0        # Para almacenar datos sensibles

  # Permisos
  permission_handler: ^12.0.1           # Para solicitar permisos de notificación 

  # Widget de Pantalla de Inicio
  home_widget: ^0.7.0                   # Para el widget de Android en la pantalla principal

  # Zona horaria del dispositivo (para programar notificaciones a la hora local)
  flutter_timezone: ^5.1.1

  # Versión instalada (se muestra en Ajustes)
  package_info_plus: ^9.0.1
  archive: ^4.7.1
  file_picker: ^11.0.3
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generadores de código (Esenciales para Drift)
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

  # Generador de Iconos de App
  flutter_launcher_icons: ^0.14.1
  sqlite3: ^2.9.4

# Configuración del Icono de la App
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/